<!DOCTYPE html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – S.A.G Decor</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f6f2ee;color:#1f1f23}
header{background:#fff;border-bottom:1px solid #ddd;padding:16px 22px;font-weight:800;font-size:20px}
header b{color:#b8212d}
main{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e3ddd6;border-radius:8px;padding:16px 18px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.meta{color:#5d5a57;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
a.b,button,select{font:inherit;font-size:14px;padding:7px 14px;border-radius:999px;border:1px solid #ccc;background:#fff;cursor:pointer;text-decoration:none;color:inherit}
a.red{background:#b8212d;color:#fff;border-color:#b8212d}
.empty{text-align:center;color:#5d5a57;padding:40px}
</style></head><body>
<header>S.A.G <b>Decor</b> · Kërkesat për ofertë</header>
<main id="list"><p class="empty">Duke ngarkuar…</p></main>
<script>
const list=document.getElementById('list');
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
async function load(){
  const r=await fetch('/api/admin/requests');
  const d=await r.json(); list.replaceChildren();
  if(!d.length){list.append(el('p','empty','Ende nuk ka kërkesa.'));return}
  d.forEach(q=>{
    const c=el('div','card'),t=el('div','top');
    t.append(el('strong',null,q.name),el('span','meta',new Date(q.created_at+'Z').toLocaleString('sq-AL')));
    c.append(t,el('div','meta',q.service+(q.area?' · '+q.area+' m²':'')));
    if(q.message)c.append(el('p',null,q.message));
    const r2=el('div','row'),tel=q.phone.replace(/[^\d+]/g,'');
    const call=el('a','b red','Telefono '+q.phone);call.href='tel:'+tel;
    const wa=el('a','b','WhatsApp');wa.href='https://wa.me/'+tel.replace('+','');wa.target='_blank';
    const s=el('select');['e re','kontaktuar','mbyllur'].forEach(v=>{const o=el('option',null,v);o.selected=v===q.status;s.append(o)});
    s.onchange=()=>fetch('/api/admin/requests/'+q.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})});
    const del=el('button',null,'Fshi');del.onclick=async()=>{if(confirm('Ta fshij këtë kërkesë?')){await fetch('/api/admin/requests/'+q.id,{method:'DELETE'});load()}};
    r2.append(call,wa,s,del);c.append(r2);list.append(c);
  });
}
load();
</script></body></html>
